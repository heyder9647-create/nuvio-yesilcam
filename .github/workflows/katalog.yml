name: Katalog güncelle
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 yesilcamtv_katalog.py
      - run: |
          git config user.name "katalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git commit -m "Katalog güncellendi" || echo "değişiklik yok"
          git push
